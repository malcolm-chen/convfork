# LiteLLM proxy config — OpenAI-compatible gateway in front of any backbone.
# Run: uv run litellm --config litellm-config.yaml   (listens on :4000 by default)
#
# The user picks the model per message from the composer's dropdown (see
# shared/models.ts) — the Nitro /api/chat route forwards that choice as
# `model` on each request. Each `model_name` below MUST match an `id` in
# shared/models.ts, or the dropdown offers a model this proxy can't serve.

model_list:
  # OpenAI backbones — offered whenever OPENAI_API_KEY is set.
  - model_name: gpt-5.3
    litellm_params:
      model: openai/gpt-5.3
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-5.4
    litellm_params:
      model: openai/gpt-5.4
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-5.5
    litellm_params:
      model: openai/gpt-5.5
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-5.6-sol
    litellm_params:
      model: openai/gpt-5.6-sol
      api_key: os.environ/OPENAI_API_KEY

  # Anthropic backbones — offered whenever ANTHROPIC_API_KEY is set.
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-opus-4-6
    litellm_params:
      model: anthropic/claude-opus-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-opus-4-7
    litellm_params:
      model: anthropic/claude-opus-4-7
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  drop_params: true                       # tolerate provider-specific param differences

# Optional: a master key the Nitro proxy presents as LITELLM_API_KEY. Safe to
# omit for localhost-only dev (then leave LITELLM_API_KEY blank). Set it once the
# proxy is reachable beyond localhost.
# general_settings:
#   master_key: os.environ/LITELLM_API_KEY
